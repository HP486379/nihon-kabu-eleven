    <filter id="lineGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.7" flood-color="#003b0f" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="760" height="1013" fill="url(#baseGrass)"/>

