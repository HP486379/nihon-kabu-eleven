      <stop offset="1" stop-color="#237f18"/>
    </linearGradient>
    <filter id="grassTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="4" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.22 0 0 0 0  0 0.42 0 0 0  0 0 0.16 0 0  0 0 0 0.22 0"/>
